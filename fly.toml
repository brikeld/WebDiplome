# Fly.io API app (Express + Supabase hosted mode)
# Deploy: fly deploy
# Secrets: see docs/deployment/fly.io.md

app = 'webdiplome-api'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/build-info'
