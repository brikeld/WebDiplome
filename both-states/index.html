<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        if (location.protocol === "file:") return;
        const base = document.createElement("base");
        base.href = "/both-states/";
        document.head.appendChild(base);
      })();
      window.motionOneUrl = "https://cdn.jsdelivr.net/npm/@motionone/dom@10.18.0/+esm";
    </script>
    <title>WebDiplome · Dashboard Both Showcase</title>
    <link rel="stylesheet" href="../timer-button-states/styles.css" />
    <link rel="stylesheet" href="../src/features/inferenceChain/inferenceChain.css" />
    <link rel="stylesheet" href="../tell-more-states/styles.css" />
    <link rel="stylesheet" href="styles.css?v=tell-motion-loader-2" />
  </head>
  <body class="theme-prod">
    <div class="stage">
      <header class="top">
        <div class="top__brand">
          <b>WebDiplome</b>
          <span>Timer + tell me more</span>
        </div>
        <div class="top__controls">
          <nav class="showcase-switch" aria-label="Showcase">
            <a href="../timer-button-states/index.html" class="showcase-switch__btn">Timer</a>
            <a href="../tell-more-states/index.html" class="showcase-switch__btn">Tell me more</a>
            <a href="./index.html" class="showcase-switch__btn is-on" aria-current="page">Both</a>
          </nav>
          <div class="themeswitch" aria-label="Persona theme">
            <button type="button" data-theme="prod" class="is-on">Prod</button>
            <button type="button" data-theme="sec">Sec</button>
            <button type="button" data-theme="soc">Soc</button>
          </div>
          <button type="button" class="top__play" id="playTimerFlow">Play timer flow</button>
        </div>
      </header>

      <nav class="rail" id="rail" aria-label="Combined dashboard"></nav>

      <main class="frame-area">
        <div class="capsule-host" id="capsuleHost">
          <div
            class="dashboard-capsule dashboard-capsule--figma dashboard-capsule--both"
            id="capsule"
            data-tell-mode="idle"
          >
            <div class="dashboard-actions-row" id="timerSlot"></div>
            <div class="dashboard-tell-row" id="tellRow"></div>
          </div>
        </div>
        <div class="frame-ctrl">
          <button type="button" id="resetView">Reset</button>
          <span id="frameMeta">Timer · pulse · Tell · idle</span>
        </div>
      </main>

      <aside class="notes" id="notes"></aside>
    </div>

    <script type="module" src="both-states.js"></script>
  </body>
</html>
